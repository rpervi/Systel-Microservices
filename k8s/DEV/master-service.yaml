apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master-service
  template:
    metadata:
      labels:
        app: master-service
    spec:
      hostAliases:
      - ip: "10.70.5.114"
        hostnames:
        - "inmum-dev-02" # Maps the SQL Server hostname to an empty IP, allowing the container to resolve it via the host's DNS"
      containers:
      - name: master-service
        image: masterservice:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # Informs K8s that the pod listens on 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        # CRITICAL: This forces the .NET runtime to bind to 8080 instead of the default 80
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          value: "Server=inmum-dev-02;Database=FDTest;User Id=FlightDeck_User;Password=FlightDeck_User@2024;TrustServerCertificate=True"
---
apiVersion: v1
kind: Service
metadata:
  name: master-service-svc
spec:
  selector:
    app: master-service
  ports:
    - protocol: TCP
      port: 8080       # Port the BFF uses: http://master-service-svc:8080
      targetPort: 8080 # Port inside the container (must match ASPNETCORE_URLS)
  type: LoadBalancer
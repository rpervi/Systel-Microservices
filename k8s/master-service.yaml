apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-api-deployment
spec:
  replicas: 2 # Runs two copies for high availability
  selector:
    matchLabels:
      app: master-api
  template:
    metadata:
      labels:
        app: master-api
    spec:
      containers:
      - name: master-api
        image: masterservice-api:latest # Your Docker image name
        imagePullPolicy: IfNotPresent # Use local image for Minikube/Docker Desktop
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: ConnectionStrings__DefaultConnection
          value: "Server=host.docker.internal;Database=FDTest;User Id=FlightDeck_User;Password=FlightDeck_User@2024;TrustServerCertificate=True"
---
apiVersion: v1
kind: Service
metadata:
  name: master-api-service
spec:
  selector:
    app: master-api
  ports:
    - protocol: TCP
      port: 80       # Port the service listens on
      targetPort: 8080 # Port your app listens on
  type: LoadBalancer # Makes it accessible from your browser